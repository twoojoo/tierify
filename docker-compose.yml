version: '3.8'

services:
  tierify:
    build:
      context: .
      dockerfile: Dockerfile
    image: tierify:latest
    container_name: tierify
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DB_TYPE=sqlite
      - DB_CONNECTION_STRING=/app/data/tierify.db
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - ALLOW_USAGE_BELOW_ZERO=false
    volumes:
      # Persist database
      - tierify-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - tierify-network

volumes:
  tierify-data:
    driver: local

networks:
  tierify-network:
    driver: bridge
