version: '3.8'

services:
  tierify:
    build:
      context: .
      dockerfile: Dockerfile
    image: tierify:latest
    container_name: tierify
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DB_TYPE=sqlite
      - DB_CONNECTION_STRING=/app/data/tierify.db
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - ALLOW_USAGE_BELOW_ZERO=false
    volumes:
      # Persist database
      - tierify-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - tierify-network

  # Uncomment below to use PostgreSQL instead of SQLite.
  # Also update tierify service: DB_TYPE=postgres, DB_CONNECTION_STRING, and add depends_on.
  #
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: tierify-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: tierify
  #     POSTGRES_USER: tierify
  #     POSTGRES_PASSWORD: tierify
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U tierify"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 5
  #   networks:
  #     - tierify-network

volumes:
  tierify-data:
    driver: local
  # postgres-data:
  #   driver: local

networks:
  tierify-network:
    driver: bridge
